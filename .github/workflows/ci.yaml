name: Hello World 
on: # Trigger
  push: # Evento
  pull_request: 
    branches: 
      - main
jobs: 
  hello-world: #Identificador del job
    name: Hola Mundo
    if: ${{ github.event.name == 'pull_request' }}
    runs-on: ubuntu-slim #Runner / Maquina que ejecuta
    steps: # Paso que se va ejecutar
      - name: Hello World
        run: echo "Hello World"
      - name: TerraformCMD
        run: terraform init
  job2: #Identificador del job
    runs-on: ubuntu-slim #Runner / Maquina que ejecuta
    steps: # Paso que se va ejecutar
      - name: checkout 
        uses: actions/checkout@v7
  job3-needs: #Identificador del job
    runs-on: ubuntu-slim #Runner / Maquina que ejecuta
    needs: job2
    steps: # Paso que se va ejecutar
      - name: checkout 
        uses: actions/checkout@v7