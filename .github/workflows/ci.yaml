name: Hello World 
on: # Trigger
  push: # Evento
jobs: 
  hello-world: #Identificador del job
    name: Hola Mundo
    runs-on: ubuntu-slim #Runner / Maquina que ejecuta
    steps: # Paso que se va ejecutar
      - name: Hello World
        run: echo "Hello World"
  job2: #Identificador del job
    runs-on: ubuntu-slim #Runner / Maquina que ejecuta
    steps: # Paso que se va ejecutar
      - name: checkout 
        uses: actions/checkout@v7
  job3-needs: #Identificador del job
    runs-on: ubuntu-slim #Runner / Maquina que ejecuta
    needs: hello-world
    steps: # Paso que se va ejecutar
      - name: checkout 
        uses: actions/checkout@v7